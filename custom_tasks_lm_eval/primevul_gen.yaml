task: primevul_gen
dataset_path: colin/PrimeVul
dataset_name: paired
output_type: generate_until

test_split: train
num_fewshot: 0

doc_to_text: "You are a security expert specializing in C/C++ vulnerability detection. Your task is to analyze the given function and determine whether it contains a security vulnerability such as buffer overflow, use-after-free, integer overflow, null pointer dereference, or other common CWE weaknesses.\n\nFunction:\n```c\n{{func}}\n```\n\nIs this function vulnerable? Answer in the format \\boxed{Yes} or \\boxed{No}.\n\nAnswer:"
doc_to_target: "{% if target == 1 %}Yes{% else %}No{% endif %}"

generation_kwargs:
  until:
    - "}"
    - "<|im_end|>"
    - "</s>"
  do_sample: true
  temperature: 0.2
  max_gen_toks: 20

repeats: 5

filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "(?i)(yes|no)"
      - function: "take_first"

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
