task: primevul_gen
dataset_path: colin/PrimeVul
dataset_name: paired
output_type: generate_until

test_split: train
num_fewshot: 0

doc_to_text: "Analyze this C/C++ function and determine if it contains a security vulnerability.\n\nFunction:\n```c\n{{func}}\n```\n\nIs this function vulnerable? Answer with only Yes or No.\n\nAnswer:"
doc_to_target: "{% if target == 1 %}Yes{% else %}No{% endif %}"

generation_kwargs:
  until:
    - "\n"
    - "."
    - "<|im_end|>"
    - "</s>"
  do_sample: true
  temperature: 0.2
  max_gen_toks: 10

repeats: 10

filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "(?i)(yes|no)"
      - function: "take_first"

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
