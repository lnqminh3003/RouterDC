task: primevul_gen
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    train: data_preprocessing/datasets/primevul_balance/all.jsonl
output_type: generate_until

test_split: train
num_fewshot: 0

doc_to_text: "You are a security expert specializing in C/C++ vulnerability detection. Your task is to analyze the given function carefully and determine whether it contains a security vulnerability. Answer Yes if you can identify a vulnerability.\n\nFunction:\n```c\n{{func}}\n```\n\nIs this function vulnerable? Respond is only allowed to be with this format \\boxed{Yes} or \\boxed{No}. No explanation, no other text. \n\nAnswer:"
doc_to_target: "{% if target == 1 %}Yes{% else %}No{% endif %}"

generation_kwargs:
  until:
    - "}"
    - "<|im_end|>"
    - "</s>"
  do_sample: true
  temperature: 0.2
  max_gen_toks: 20

repeats: 5

filter_list:
  - name: "extract-answer"
    filter:
      - function: "regex"
        regex_pattern: "(?i)(yes|no)"
      - function: "take_first"

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
